<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario en una Caja</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-dark ">

  <div class="container mt-4">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-center mt-2">
          <div class="border border-secondary p-1">
            <h2 class="mb-0"><strong>INGRESAR DATOS DE SU TARJETA</strong></h2>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-1 mb-3">
          <div class="bg-danger border border-primary text-white p-2">
            <h6 class="mb-0">Llenar todo lo que pide</h6>
          </div>
        </div>

        <form>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="XXX" class="form-label">Tarjeta</label>
              <input type="text" class="form-control" id="XXX" placeholder="XXXXXXXXXXXX"/>
            </div>
            <div class="col-md-4 mb-3">
              <label for="CVV" class="form-label">CVV</label>
              <input type="text" class="form-control" id="CVV" placeholder="000"/>
            </div>
            <div class="col-md-4 mb-3">
              <label for="Cantidad" class="form-label">Cantidad</label>
              <input type="text" class="form-control" id="Cantidad" placeholder="Cantidad"/>
            </div>
          </div> 

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="Nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="Nombre"/>
            </div>
            <div class="col-md-6 mb-3">
              <label for="Apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="Apellido"/>
            </div>
          </div> 

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="State" class="form-label">State</label>
              <input type="text" class="form-control" id="State"/>
            </div>
            <div class="col-md-3 mb-3">
              <label for="pueblo" class="form-label">Elige tu pueblo</label>
              <select class="form-control" id="pueblo">
                <option disabled selected>Seleccione un pueblo</option>
                <option>Veracruz</option>
                <option>Cancun</option>
                <option>Puebla</option>
              </select>
            </div>
            <div class="col-md-3 mb-3">
              <label for="State2" class="form-label">Otro State</label>
              <input type="text" class="form-control" id="State2"/>
            </div>
          </div>

          <div class="row">
            <div class="col-6 text-center mb-4">
              <p class="mb-2">Aceptamos:</p>
              <i class="fab fa-cc-visa fa-2x mx-2"></i>
              <i class="fab fa-cc-mastercard fa-2x mx-2"></i>
              <i class="fab fa-cc-amex fa-2x mx-2"></i>
              <i class="fab fa-cc-discover fa-2x mx-2"></i>
              <i class="fab fa-cc-diners-club fa-2x mx-2"></i>
              <i class="fab fa-cc-jcb fa-2x mx-2"></i>
            </div>
         

          <div class="col-md-6 ">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="aceptoCondiciones">
              <label class="form-check-label" for="aceptoCondiciones">
                Acepto términos y condiciones
              </label>
            </div>
          </div>
        

         
          <div class="row">
            <div class="d-flex justify-content-end gap-2 mt-3">
              <button type="submit" class="btn btn-secondary">Cancelar</button>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
            
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
